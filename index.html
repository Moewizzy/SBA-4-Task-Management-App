<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <title>SBA.4</title>
</head>
<body>
    <main class="container">
    <h1>Task Manger</h1>

    <!-- Add a new task -->
    <form id="task-form" class="card">
        <input id="task-name" type="text" placeholder="Task name" required>

        <select id="task-catagory">
            <option>Work</option>
            <option>School</option>
            <option>Personal</option>
            <option>Other</option>
        </select>

        <input id="task-deadline"
        type="date" required>

        <select id="task-status">
            <option>In Progress</option>
            <option>Completed</option>
        </select>

        <button type="submit">Add Task</button>
    </form>

<!-- Feedback (screen reader)-->
     <p id="message" aria-live="polite">
    </p>

<!-- Filter Task -->
    <div class="card filters">
        <label>
            <select id="filter-status">
                <option>All</option>
                <option>In Progress</option>
                <option>Completd</option>
                <option>Overdue</option>
            </select>
        </label>

        <label>Catagory
            <select id="filter-catagory">
                <option>All</option>
                <option>Work</option>
                <option>School</option>
                <option>Personal</option>
                <option>Other</option>
            </select>
        </label>

      <span id= "count"></span>

    </div>

</body>
</html>
